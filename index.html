<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>보건 데일리</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#17233a;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#102c54;color:white;padding:30px max(20px,calc((100vw - 1120px)/2))}header h1{margin:0 0 8px;font-size:30px}header p{margin:0;color:#c9dcf5}.wrap{max-width:1120px;margin:24px auto;padding:0 16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.panel,.article{background:white;border:1px solid #e0e7ef;border-radius:12px;padding:18px}.stat{cursor:pointer;text-align:left;color:inherit}.stat:hover,.stat.active{border-color:#2368b3;background:#eef6ff}.stat small{display:block;color:#627187;margin-bottom:10px}.stat strong{font-size:27px}.panel{margin-top:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}input,select,button{font:inherit}input,select{border:1px solid #ccd6e3;border-radius:8px;padding:10px;min-height:42px}input{flex:1;min-width:190px}.article{margin:10px 0}.article h3{margin:8px 0;font-size:17px}.article a{color:#164e91;text-decoration:none}.article p{color:#46566b;line-height:1.5}.meta{color:#748299;font-size:13px}.pill{font-size:12px;border-radius:6px;background:#eaf2fc;color:#245a96;padding:4px 7px;display:inline-block;margin-right:6px}.pill.important{background:#fff0eb;color:#a4361b}.pill.normal{background:#eaf5ef;color:#246e4b}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{border:1px solid #cbd5e1;background:white;border-radius:7px;padding:7px 10px;cursor:pointer}.date-group{margin:16px 0;border:1px solid #dbe4ef;border-radius:12px;overflow:hidden}.date-group summary{cursor:pointer;padding:15px 17px;background:#f1f6fc;font-weight:700;display:flex;justify-content:space-between;gap:12px}.date-group .date-items{padding:0 12px 10px}.today-heading{margin:20px 0 8px;font-size:20px}.date-count{font-weight:400;color:#60728a;font-size:14px}.notice{color:#5e6c7f;font-size:13px;line-height:1.6}#status{font-size:13px;color:#55677e}.featured{border-left:4px solid #cc684b}.featured-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.featured-grid .article{margin:0}@media(max-width:700px){.stats,.featured-grid{grid-template-columns:repeat(2,minmax(0,1fr))}header{padding:24px 16px}.featured-grid{grid-template-columns:1fr}}
</style></head><body><header><h1>보건 데일리</h1><p>산업보건 소식 8개 분야 · 매일 자동 수집</p></header><main class="wrap"><div id="status">데이터 불러오는 중…</div><section class="stats" id="stats"></section><section class="panel"><h2>꼭 볼 소식</h2><p class="notice">최근 30일의 중요 뉴스 최대 4건입니다. 제목의 키워드로 선별한 참고 정보이며, 법령 개정·시행 여부는 반드시 공식 원문을 확인하세요.</p><div class="featured-grid" id="featured"></div></section><section class="panel"><h2>보건 소식 찾아보기 <span id="total"></span></h2><div class="toolbar"><input id="search" placeholder="제목·내용 검색" aria-label="검색"><select id="period" aria-label="기간"><option value="7">최근 7일</option><option value="30">최근 30일</option><option value="all">전체 기간</option></select><select id="priority" aria-label="중요도"><option value="all">모든 중요도</option><option value="중요">중요</option><option value="일반">일반</option><option value="참고">참고</option></select><select id="view" aria-label="보기"><option value="all">전체 소식</option><option value="saved">즐겨찾기</option><option value="unread">읽지 않음</option></select></div><p class="notice">기사 제목과 요약은 외부 RSS에서 가져옵니다. AI 검증 요약이 아니며, 법령·정책의 정확한 내용과 시행일은 반드시 원문에서 확인하세요. 분야·중요도는 키워드 기반으로 일부 오분류가 있을 수 있습니다.</p><div id="articles"></div></section></main><script>
const cats=['뉴스','법령·입법예고','화학물질 규제','공지·지침','재해·직업병 사례','지원사업','채용','정보·자료'];let data=[],category='전체';const $=id=>document.getElementById(id);let saved={},read={};try{saved=JSON.parse(localStorage.getItem('hd_saved')||'{}');read=JSON.parse(localStorage.getItem('hd_read')||'{}')}catch(e){}const important=['산업안전보건법 개정','산업안전보건법 시행','시행규칙 개정','시행령 개정','입법예고','고시 개정','노출기준 개정','특수건강진단','작업환경측정','중대재해','직업병 인정','msds 의무','물질안전보건자료 의무'];const relevant=['산업보건','보건관리자','산업안전보건','근로자 건강','직업병','직업성 질병','특수건강진단','건강진단','건강검진','작업환경측정','msds','물질안전보건자료','노출기준','화학물질','근골격계','직무스트레스','안전보건공단','고용노동부','kosha','산업간호사','산업재해','중대재해','직업성','직업건강','안전보건','유해인자'];function priorityOf(x){if(['중요','일반','참고'].includes(x.priority))return x.priority;const t=(x.title||'').toLowerCase(),body=(t+' '+(x.summary||'')).toLowerCase(),n=relevant.filter(k=>body.includes(k.toLowerCase())).length;if(important.some(k=>t.includes(k.toLowerCase()))&&n)return '중요';if(n>=2||(n>=1&&['법령·입법예고','화학물질 규제','재해·직업병 사례'].includes(x.category)))return '일반';return '참고'}function el(tag,cls,txt){const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}function persist(){try{localStorage.setItem('hd_saved',JSON.stringify(saved));localStorage.setItem('hd_read',JSON.stringify(read))}catch(e){}}function cutoffDate(days){const now=new Date();const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-days+1);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function makeArticle(x,featured=false){const a=el('article','article'+(featured?' featured':'')),tag=el('span','pill',x.category),pr=priorityOf(x),ptag=el('span','pill '+(pr==='중요'?'important':pr==='일반'?'normal':''),pr),meta=el('div','meta',`${x.date||'날짜 미상'} · ${x.source||'출처 미상'}`),h=el('h3'),link=el('a','',x.title||'제목 없음');if(typeof x.url==='string'&&/^https:\/\//.test(x.url)){link.href=x.url;link.target='_blank';link.rel='noopener noreferrer'}h.append(link);const desc=el('p','',x.summary||'원문 확인'),act=el('div','actions'),star=el('button','',saved[x.id]?'★ 즐겨찾기':'☆ 즐겨찾기'),seen=el('button','',read[x.id]?'✓ 읽음':'읽음 표시');star.onclick=()=>{saved[x.id]=!saved[x.id];persist();render()};seen.onclick=()=>{read[x.id]=!read[x.id];persist();render()};act.append(star,seen);a.append(tag,ptag,meta,h,desc,act);return a}function render(){const stats=$('stats');stats.replaceChildren();for(const c of ['전체',...cats]){const b=el('button','stat'+(category===c?' active':''));b.append(el('small','',c),el('strong','',String(c==='전체'?data.length:data.filter(x=>x.category===c).length)+'건'));b.onclick=()=>{category=c;render()};stats.append(b)}const featured=$('featured');featured.replaceChildren();const highlights=data.filter(x=>x.date>=cutoffDate(30)&&priorityOf(x)==='중요').sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,4);if(!highlights.length)featured.append(el('p','notice','최근 30일간 중요 키워드에 해당하는 소식이 없습니다.'));else highlights.forEach(x=>featured.append(makeArticle(x,true)));let list=data.filter(x=>category==='전체'||x.category===category),q=$('search').value.trim().toLowerCase(),p=$('period').value,v=$('view').value,priority=$('priority').value;if(q)list=list.filter(x=>((x.title||'')+' '+(x.summary||'')+' '+(x.source||'')).toLowerCase().includes(q));if(p!=='all')list=list.filter(x=>(x.date||'')>=cutoffDate(Number(p)));if(priority!=='all')list=list.filter(x=>priorityOf(x)===priority);if(v==='saved')list=list.filter(x=>saved[x.id]);if(v==='unread')list=list.filter(x=>!read[x.id]);list.sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.collected_at||'').localeCompare(a.collected_at||''));$('total').textContent=`${list.length}건`;const box=$('articles');box.replaceChildren();if(!list.length){box.append(el('p','notice','해당 조건의 소식이 없습니다. 기간 또는 검색 조건을 조정하세요.'));return}const kstDate=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const groups=new Map();for(const x of list.slice(0,300)){const day=x.date||'날짜 미상';if(!groups.has(day))groups.set(day,[]);groups.get(day).push(x)}const today=groups.get(kstDate)||[];box.append(el('h3','today-heading',`오늘의 보건 소식 · ${kstDate} (${today.length}건)`));if(today.length)today.forEach(x=>box.append(makeArticle(x)));else box.append(el('p','notice','오늘 발행된 소식이 없습니다. 지난 소식을 확인해 주세요.'));groups.delete(kstDate);const older=[...groups.keys()].sort((a,b)=>b.localeCompare(a));if(older.length)box.append(el('h3','today-heading','지난 소식 · 날짜별 보기'));for(const day of older){const details=el('details','date-group'),summary=el('summary',''),name=el('span','',day),count=el('span','date-count',`${groups.get(day).length}건 · 클릭해서 펼치기`),items=el('div','date-items');summary.append(name,count);groups.get(day).forEach(x=>items.append(makeArticle(x)));details.append(summary,items);box.append(details)}}for(const id of ['search','period','priority','view'])$(id).addEventListener(id==='search'?'input':'change',render);fetch('./news.json?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{data=Array.isArray(d)?d:(Array.isArray(d.items)?d.items:[]);$('status').textContent=`저장된 소식 ${data.length}건 · 데이터는 예약 실행 후 갱신됩니다.`;render()}).catch(e=>{$('status').textContent='데이터를 불러오지 못했습니다: '+e.message;render()});
</script></body></html>
