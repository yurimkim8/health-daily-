<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>보건 데일리</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#17233a;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#102c54;color:white;padding:30px max(20px,calc((100vw - 1120px)/2))}header h1{margin:0 0 8px;font-size:30px}header p{margin:0;color:#c9dcf5}.wrap{max-width:1120px;margin:24px auto;padding:0 16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.panel,.article{background:white;border:1px solid #e0e7ef;border-radius:12px;padding:18px}.stat{cursor:pointer;text-align:left;color:inherit}.stat:hover,.stat.active{border-color:#2368b3;background:#eef6ff}.stat small{display:block;color:#627187;margin-bottom:10px}.stat strong{font-size:27px}.panel{margin-top:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}input,select,button{font:inherit}input,select{border:1px solid #ccd6e3;border-radius:8px;padding:10px;min-height:42px}input{flex:1;min-width:190px}.article{margin:10px 0}.article h3{margin:8px 0;font-size:17px}.article a{color:#164e91;text-decoration:none}.article p{color:#46566b;line-height:1.5}.meta{color:#748299;font-size:13px}.pill{font-size:12px;border-radius:6px;background:#eaf2fc;color:#245a96;padding:4px 7px}.actions{display:flex;gap:8px}.actions button{border:1px solid #cbd5e1;background:white;border-radius:7px;padding:7px 10px;cursor:pointer}.notice{color:#5e6c7f;font-size:13px;line-height:1.6}#status{font-size:13px;color:#55677e}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}header{padding:24px 16px}}
</style></head><body><header><h1>보건 데일리</h1><p>산업보건 소식 8개 분야 · 매일 자동 수집</p></header><main class="wrap"><div id="status">데이터 불러오는 중…</div><section class="stats" id="stats"></section><section class="panel"><h2>보건 소식 찾아보기 <span id="total"></span></h2><div class="toolbar"><input id="search" placeholder="제목·내용 검색" aria-label="검색"><select id="period" aria-label="기간"><option value="7">최근 7일</option><option value="30">최근 30일</option><option value="all">전체 기간</option></select><select id="view" aria-label="보기"><option value="all">전체 소식</option><option value="saved">즐겨찾기</option><option value="unread">읽지 않음</option></select></div><p class="notice">기사 제목과 요약은 외부 RSS에서 가져옵니다. AI 검증 요약이 아니며, 법령·정책의 정확한 내용과 시행일은 반드시 원문에서 확인하세요. 각 분야는 키워드 기반 분류로 일부 중복·오분류가 있을 수 있습니다.</p><div id="articles"></div></section></main><script>
const cats=['뉴스','법령·입법예고','화학물질 규제','공지·지침','재해·직업병 사례','지원사업','채용','정보·자료'];let data=[],category='전체';const $=id=>document.getElementById(id);let saved={},read={};try{saved=JSON.parse(localStorage.getItem('hd_saved')||'{}');read=JSON.parse(localStorage.getItem('hd_read')||'{}')}catch(e){}function el(tag,cls,txt){let x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}function persist(){localStorage.setItem('hd_saved',JSON.stringify(saved));localStorage.setItem('hd_read',JSON.stringify(read))}function render(){const stats=$('stats');stats.replaceChildren();for(const c of ['전체',...cats]){let b=el('button','stat'+(category===c?' active':''));b.append(el('small','',c),el('strong','',String(c==='전체'?data.length:data.filter(x=>x.category===c).length)+'건'));b.onclick=()=>{category=c;render()};stats.append(b)}let list=data.filter(x=>category==='전체'||x.category===category),q=$('search').value.trim().toLowerCase(),p=$('period').value,v=$('view').value;if(q)list=list.filter(x=>(x.title+' '+x.summary+' '+x.source).toLowerCase().includes(q));if(p!=='all'){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-Number(p)+1);const cutoff=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');list=list.filter(x=>x.date>=cutoff)}if(v==='saved')list=list.filter(x=>saved[x.id]);if(v==='unread')list=list.filter(x=>!read[x.id]);$('total').textContent=`${list.length}건`;const box=$('articles');box.replaceChildren();if(!list.length)box.append(el('p','notice','해당 조건의 소식이 없습니다. 기간을 전체로 바꾸거나 검색 조건을 조정하세요.'));for(const x of list.slice(0,300)){const a=el('article','article'),tag=el('span','pill',x.category),meta=el('div','meta',`${x.date} · ${x.source||'출처 미상'}`),h=el('h3'),link=el('a','',x.title);link.href=x.url;link.target='_blank';link.rel='noopener noreferrer';h.append(link);let desc=el('p','',x.summary||'원문 확인'),act=el('div','actions'),star=el('button','',saved[x.id]?'★ 즐겨찾기':'☆ 즐겨찾기'),seen=el('button','',read[x.id]?'✓ 읽음':'읽음 표시');star.onclick=()=>{saved[x.id]=!saved[x.id];persist();render()};seen.onclick=()=>{read[x.id]=!read[x.id];persist();render()};act.append(star,seen);a.append(tag,meta,h,desc,act);box.append(a)}}for(const id of ['search','period','view'])$(id).addEventListener(id==='search'?'input':'change',render);fetch('./news.json?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{data=Array.isArray(d)?d:[];$('status').textContent=`저장된 소식 ${data.length}건 · 데이터는 예약 실행 후 갱신됩니다.`;render()}).catch(e=>{$('status').textContent='데이터를 불러오지 못했습니다: '+e.message;render()});
</script></body></html>
